server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # always fetch fresh config
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # React Router: /holds/abc must return index.html, not 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
